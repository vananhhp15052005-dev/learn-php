
services:
  web:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    ports:
      - '8080:80'
    volumes:
      - './public:/var/www/html'
      - './src:/var/www/src'
    environment:
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    depends_on:
      - db

  db:
    image: mysql:8.0
  
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - data_test:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d

volumes:
  data_test:
